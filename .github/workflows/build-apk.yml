name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FNF-Mod-Manager.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FNF-Mod-Manager-debug-apk
          path: FNF-Mod-Manager.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FNF Mod Manager build ${{ github.run_number }}
          files: FNF-Mod-Manager.apk
